[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppilot"
version = "0.1.0"
description = "ShopPilot+ agentic store-ops assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "jsonschema==4.26.0",
  "anthropic==2.3.0",
  "stripe==16.1.0",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "playwright==1.64.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**", "llm/prompts/*"]

[dependency-groups]
dev = ["shoppilot[dev]"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real API keys"]
addopts = "-q -m 'not live' --cov=app --cov-report=term-missing:skip-covered"
