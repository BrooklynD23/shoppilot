name: CI
on: [push, pull_request]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -m "not live" --cov-fail-under=80
        env: { APP_ENV: test }
  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t shoppilot .
      - run: |
          docker run -d -p 8000:8000 --memory=512m -e GOOGLE_CLOUD_PROJECT=dummy -e GOOGLE_API_KEY=dummy-not-a-key --name sp shoppilot
          for i in $(seq 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/healthz || { docker logs sp; exit 1; }
          curl -fsS localhost:8000/ | grep -qi '<html'
          docker stats --no-stream sp
          docker image ls shoppilot
